# Copy to .github/workflows/ci.yml (the remote file bridge cannot write there).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          mapfile -t files < <(find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.mm' \))
          printf 'checking %d files\n' "${#files[@]}"
          clang-format --dry-run --Werror "${files[@]}"

  ui:
    name: web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run build
        working-directory: ui

  build:
    # macOS and Linux build only what is meant to be portable, so the moment
    # something platform-specific leaks out of src/platform/ the build goes red.
    # They skip the shell, which is the only target that needs CEF: a gigabyte
    # of Chromium per run to prove a point the other jobs already prove.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64 (full)
            os: windows-2022
            preset: win-debug
            needs_cef: true
          - name: macos-arm64 (portable targets)
            os: macos-14
            preset: mac-release
            needs_cef: false
          - name: linux-x64 (portable targets)
            os: ubuntu-latest
            preset: linux-debug
            needs_cef: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the full history and tags

      # The embedded asset table is generated from ui/dist at build time, and
      # one of the tests checks it is real rather than empty.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

      - name: Configure vcpkg environment (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"

      - name: Configure vcpkg environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Roughly a gigabyte, extracted. Keyed on the pinned version, so it is
      # downloaded once per CEF bump and never again.
      - name: Cache CEF
        if: matrix.needs_cef
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ runner.os }}-${{ hashFiles('cmake/cef_version.cmake') }}

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.os }}
          path: |
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore
