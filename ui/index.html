<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonora</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <header id="search"></header>
      <main id="content"></main>
      <aside id="queue"></aside>
      <footer id="transport"></footer>
    </div>
    <!-- The agent panel. A sentence in, and the plan the shell is willing to carry out --
         every step of it shown, because a plan nobody can read is a plan nobody can agree
         to. Removed entirely when the capability is off. See ADR 0016. -->
    <section id="agent-panel"></section>
    <!-- Week 4's diagnostics page, now a panel that starts closed. Still the
         fastest way to see whether the bridge, the negotiation and the event
         coalescing are working, from inside the application. -->
    <details id="diagnostics-panel">
      <summary>Bridge diagnostics</summary>
      <dl id="diagnostics"></dl>
    </details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
