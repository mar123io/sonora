# Copy to .github/workflows/ci.yml (the remote file bridge cannot write there).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The release job in week 10's second half asks for
# contents: write on its own, which is the one place it is needed.
permissions:
  contents: read

env:
  # The formatter's version, exactly, in one place.
  #
  # Not "whatever apt has": two clang-format majors disagree about real code,
  # and a check that passes locally and fails in CI is worse than no check. The
  # pip package publishes the LLVM binaries under an exact version, which is
  # the only way to say the same number on Ubuntu, on Windows and in a
  # container. tools/format.ps1 reads the same number and warns when the
  # clang-format it found is a different major.
  CLANG_FORMAT_VERSION: '20.1.7'
  NODE_VERSION: '22'
  # WiX v4. Unpinned, `dotnet tool install wix` takes v7, which will not build
  # anything until somebody accepts a commercial licence -- see the note in
  # tools/package.ps1.
  WIX_VERSION: '4.*'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          clang-format --version
          mapfile -t files < <(find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.mm' \))
          printf 'checking %d files\n' "${#files[@]}"
          clang-format --dry-run --Werror "${files[@]}"

  ui:
    name: web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run build
        working-directory: ui

  build:
    # macOS and Linux build only what is meant to be portable, so the moment
    # something platform-specific leaks out of src/platform/ the build goes red.
    # They skip the shell, which is the only target that needs CEF: a gigabyte
    # of Chromium per run to prove a point the other jobs already prove.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64 (full)
            os: windows-2022
            preset: win-debug
            needs_cef: true
          - name: macos-arm64 (portable targets)
            os: macos-14
            preset: mac-release
            needs_cef: false
          - name: linux-x64 (portable targets)
            os: ubuntu-latest
            preset: linux-debug
            needs_cef: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Both halves matter: the full history so `git describe` can find a
          # tag, and the tags themselves, which a shallow checkout does not
          # fetch even with depth 0 on some runner images.
          fetch-depth: 0
          fetch-tags: true

      # The UI is built by the build itself (-DSONORA_BUILD_UI=ON below), which
      # is what makes "this binary contains the interface from this commit" a
      # property rather than a hope. Node still has to be here for it, and the
      # npm cache still pays for itself.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # vcpkg, ours, at the commit vcpkg.json pins -- not the clone the runner
      # image ships.
      #
      # Two failures taught this, and the second explained the first. Fetching
      # the baseline commit into the image's clone lets vcpkg read
      # versions/baseline.json out of it, and that much worked; but the
      # per-port version database is read from the working tree, which is still
      # at whatever commit the image was built with. So baseline.json asked for
      # sqlite3 3.53.4#1 and the tree next to it had never heard of it:
      #
      #   error: no version database entry for sqlite3 at 3.53.4#1
      #
      # There is no half-measure here. Having the registry a baseline describes
      # means having the registry at that commit, which means owning the
      # checkout. The cost is a clone on the first run of each baseline and a
      # cache hit on every run after, and what it buys is the sentence this
      # week exists to make true: the same tag produces the same binaries, on
      # this machine and on a runner, today and in three years.
      - name: vcpkg environment (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"

      - name: vcpkg environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null

      # Keyed on vcpkg.json, which is where the baseline lives: change the
      # baseline and the key changes with it, which is exactly when a different
      # registry is wanted.
      - name: Cache the vcpkg checkout
        uses: actions/cache@v4
        with:
          path: .vcpkg
          key: vcpkg-tree-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Check out vcpkg at the baseline
        shell: bash
        run: |
          set -eu
          # grep rather than a JSON parser: the first forty hex characters in
          # this file are the baseline, and the last attempt used python with
          # $GITHUB_WORKSPACE interpolated into a string literal -- where
          # "D:\a\sonora" became a bell character and a path nobody could read.
          # A step that needs one value should not need an interpreter.
          baseline=$(grep -o '[0-9a-f]\{40\}' vcpkg.json | head -n 1)
          echo "baseline: $baseline"

          # Relative paths throughout: bash starts in the workspace, and a
          # Windows path with backslashes is the other thing that broke.
          if [ ! -d .vcpkg/.git ]; then
            git init -q .vcpkg
            git -C .vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          fi
          if ! git -C .vcpkg cat-file -e "$baseline^{commit}" 2>/dev/null; then
            # One commit, no history: the version database is a tree, not a log.
            git -C .vcpkg fetch --depth 1 origin "$baseline"
          fi
          git -C .vcpkg checkout -q --detach "$baseline"

          if [ ! -x .vcpkg/vcpkg ] && [ ! -x .vcpkg/vcpkg.exe ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
            else
              ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
            fi
          fi

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Roughly a gigabyte, extracted. Keyed on the pinned version, so it is
      # downloaded once per CEF bump and never again.
      - name: Cache CEF
        if: matrix.needs_cef
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ runner.os }}-${{ hashFiles('cmake/cef_version.cmake') }}

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja


      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSONORA_BUILD_UI=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.os }}
          path: |
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The installer, and the release it is attached to
  # ---------------------------------------------------------------------------
  # Runs on a tag, and on a manual dispatch so the packaging path can be
  # exercised without inventing a version. It does not run on every push: an
  # MSI that nobody will install is fifteen minutes of a Windows runner.
  package:
    name: MSI
    needs: [format, ui, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The same checkout as the matrix job above; see the note there.
      - name: vcpkg environment
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null

      - name: Cache the vcpkg checkout
        uses: actions/cache@v4
        with:
          path: .vcpkg
          key: vcpkg-tree-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Check out vcpkg at the baseline
        shell: bash
        run: |
          set -eu
          baseline=$(grep -o '[0-9a-f]\{40\}' vcpkg.json | head -n 1)
          echo "baseline: $baseline"
          if [ ! -d .vcpkg/.git ]; then
            git init -q .vcpkg
            git -C .vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          fi
          if ! git -C .vcpkg cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git -C .vcpkg fetch --depth 1 origin "$baseline"
          fi
          git -C .vcpkg checkout -q --detach "$baseline"
          if [ ! -x .vcpkg/vcpkg.exe ]; then
            ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          fi

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-Windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-Windows-

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-Windows-${{ hashFiles('cmake/cef_version.cmake') }}



      - name: Install WiX ${{ env.WIX_VERSION }}
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      # Not signed here. The certificate this repository can produce is
      # self-signed, which is trusted by exactly one machine -- see
      # tools/sign.ps1 -- and a signature nobody can verify is worse than none
      # on a file other people download. The signing step belongs next to a
      # real certificate in a key store, and this is where it would go.
      - name: Build the MSI
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: sonora-msi
          path: build/packages/*.msi
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # The update artefacts
      # -----------------------------------------------------------------------
      # Built from `build/win-release/stage` -- the same staging directory the MSI
      # was built from, in the same job. That is not a convenience: it is the only
      # arrangement in which the installer and the update package cannot disagree
      # about what version 0.6.0 contains.
      #
      # The version comes out of the MSI's own file name rather than from the tag,
      # so if those two ever diverge this step is where it is noticed.
      - name: Build the update package
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/packages/*.msi | Select-Object -First 1
          if ($msi.Name -notmatch 'Sonora-(\d+\.\d+\.\d+)-x64\.msi') {
            throw "cannot read a version out of $($msi.Name)"
          }
          $version = $Matches[1]
          "SONORA_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path build/updates | Out-Null
          # Visual Studio is a multi-config generator and Ninja is not, so the
          # executable is under bin/Release with one and bin with the other. Finding it
          # beats encoding which generator the runner happened to pick.
          $tool = (Get-ChildItem -Path build/win-release -Recurse -Filter sonora_release.exe |
                   Select-Object -First 1).FullName
          if (-not $tool) { throw 'sonora_release.exe was not built' }
          $spk = "build/updates/Sonora-$version-win-x64.spk"
          & $tool pack build/win-release/stage $spk
          if ($LASTEXITCODE -ne 0) { throw 'sonora_release pack failed' }
          & $tool compress $spk "$spk.zst"
          if ($LASTEXITCODE -ne 0) { throw 'sonora_release compress failed' }

      # A patch for each of the last three releases that published one, and none for
      # the ones that did not -- which includes every release before week 11. A client
      # that finds no delta from its own version takes the full package, so a missing
      # patch costs bytes and nothing else, and this step never fails the build for it.
      - name: Generate the deltas
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:SONORA_RELEASE_VERSION
          $urlBase = "https://github.com/${{ github.repository }}/releases/download/v$version"
          # Visual Studio is a multi-config generator and Ninja is not, so the
          # executable is under bin/Release with one and bin with the other. Finding it
          # beats encoding which generator the runner happened to pick.
          $tool = (Get-ChildItem -Path build/win-release -Recurse -Filter sonora_release.exe |
                   Select-Object -First 1).FullName
          if (-not $tool) { throw 'sonora_release.exe was not built' }
          $spk = "build/updates/Sonora-$version-win-x64.spk"
          $arguments = @(
            '--out', 'build/updates/manifest.json',
            '--channel', 'stable',
            '--release', "${version}:win-x64:${spk}:${spk}.zst:$urlBase"
          )

          $tags = @()
          try {
            $tags = gh release list --limit 15 --json tagName,isDraft |
              ConvertFrom-Json |
              Where-Object { -not $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { $_.tagName } |
              Where-Object { $_ -ne "v$version" } |
              Select-Object -First 3
          } catch {
            Write-Host "no release list available: $($_.Exception.Message)"
          }

          foreach ($tag in $tags) {
            $old = $tag.Substring(1)
            $dir = "build/updates/prev/$tag"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            gh release download $tag --pattern '*-win-x64.spk.zst' --dir $dir 2>$null
            $package = Get-ChildItem "$dir/*.spk.zst" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $package) {
              Write-Host "$tag published no update package; clients on it will take the full one"
              continue
            }
            $oldSpk = "$dir/$old.spk"
            & $tool expand $package.FullName $oldSpk
            if ($LASTEXITCODE -ne 0) { Write-Host "cannot expand $tag"; continue }
            $patch = "build/updates/$old-$version-win-x64.patch"
            & $tool delta $oldSpk $spk $patch
            if ($LASTEXITCODE -ne 0) { Write-Host "cannot patch $old -> $version"; continue }
            # The old release is listed too, so that a client running it can check its
            # own installation against the archive hash it was published with before it
            # patches from it. Without that entry the delta path still works, but the
            # first thing that notices a modified installation is a wasted download.
            $oldZst = $package.FullName
            $oldUrlBase = "https://github.com/${{ github.repository }}/releases/download/$tag"
            $arguments += @('--release', "${old}:win-x64:${oldSpk}:${oldZst}:$oldUrlBase")
            $arguments += @('--delta', "${version}:${old}:$patch")
            Remove-Item $oldSpk -Force
          }

          $arguments | Set-Content build/updates/manifest-args.txt -Encoding ascii
          Write-Host ($arguments -join ' ')

      - name: Write the manifest
        shell: pwsh
        run: |
          $arguments = Get-Content build/updates/manifest-args.txt
          python tools/gen_manifest.py @arguments
          Get-Content build/updates/manifest.json

      # The uncompressed .spk is 213 MiB and nobody downloads it: it exists during this
      # job so that patches can be computed against it, and its hash in the manifest is
      # what a client checks its own reconstruction against.
      - name: Upload the update artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sonora-updates
          path: |
            build/updates/*.spk.zst
            build/updates/*.patch
            build/updates/manifest.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The one job that writes anything. Everything else in this file runs with
    # contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonora-msi
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: sonora-updates
          path: artifacts

      # The signature over the manifest, and the whole of what an installation trusts.
      #
      # It is made here with openssl rather than with a tool of ours, and that is worth a
      # sentence: the release is signed by OpenSSL on a runner and verified by libsodium
      # on somebody's laptop, and the only way to know those two agree about Ed25519 is to
      # have one check a signature the other made. tests/test_update_manifest.cpp does
      # exactly that, against a signature this same command produced.
      #
      # Without a key there is no signature, and without a signature the manifest is not
      # attached at all. An unsigned manifest is worse than no manifest: it would be a
      # file at the url every installation polls, saying whatever anybody who can write to
      # it wants, and the client would refuse it -- so all it could ever do is make a
      # working updater look broken.
      - name: Sign the manifest
        id: sign
        env:
          SONORA_RELEASE_KEY: ${{ secrets.SONORA_RELEASE_KEY }}
        run: |
          set -eu
          if [ -z "${SONORA_RELEASE_KEY:-}" ]; then
            echo "::warning::No SONORA_RELEASE_KEY, so no signed manifest is published and" \
                 "installed copies will not see this release. See ADR 0009 and" \
                 "tools/update_keygen.ps1."
            rm -f artifacts/manifest.json
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The development key's private half has been outside a secret store, so a build
          # that still trusts it trusts everybody who has ever seen this repository. This
          # is the check that stops a note in a comment from being the only thing standing
          # between that and a published release.
          if grep -q '0x90, 0x77, 0x2d, 0x19' src/update/src/signature.cpp; then
            echo "::error::src/update/src/signature.cpp still trusts the development key."
            exit 1
          fi
          umask 077
          printf '%s' "$SONORA_RELEASE_KEY" > release.pem
          openssl pkeyutl -sign -inkey release.pem -rawin \
            -in artifacts/manifest.json -out manifest.sig.bin
          od -An -tx1 manifest.sig.bin | tr -d ' \n' > artifacts/manifest.json.sig
          echo >> artifacts/manifest.json.sig
          # And verify it before publishing it, because a signature nobody checked is a
          # string of hex.
          openssl pkeyutl -verify -pubin \
            -inkey <(openssl pkey -in release.pem -pubout) -rawin \
            -in artifacts/manifest.json -sigfile manifest.sig.bin
          rm -f release.pem manifest.sig.bin
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.msi
            artifacts/*.spk.zst
            artifacts/*.patch
            artifacts/manifest.json
            artifacts/manifest.json.sig
          # A draft, not a published release. The last look before something
          # carries a version number in public is a person's, and there is
          # nothing in this pipeline that can check what a release note says.
          draft: true
          generate_release_notes: true
